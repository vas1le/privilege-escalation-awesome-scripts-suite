name: CI (lean)

# Manual trigger only: merging this file spends zero Actions minutes.
# To enable automatic runs, uncomment the block below (and keep workflow_dispatch).
#
# on:
#   pull_request:
#     paths:
#       - 'linPEAS/**'
#       - 'parsers/**'
#       - 'winPEAS/**'
#       - 'build_lists/**'
#       - '.github/workflows/ci.yml'
#   push:
#     branches: [master]
#     paths:
#       - 'linPEAS/**'
#       - 'parsers/**'
#       - 'winPEAS/**'
#       - 'build_lists/**'
#       - '.github/workflows/ci.yml'

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-python:
    name: linPEAS builder and Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv pip install --system PyYAML requests reportlab

      - name: Build linPEAS (small variant)
        working-directory: linPEAS
        run: python3 -m builder.linpeas_builder --small --output linpeas_small.sh

      - name: linPEAS module metadata tests
        run: python3 -m unittest linPEAS.tests.test_modules_metadata -v

      - name: linPEAS builder tests
        run: python3 -m unittest discover -s linPEAS/tests -p "test_*.py" -v

      - name: Parsers tests
        run: python3 -m unittest discover -s parsers/tests -p "test_*.py" -v

  windows-dotnet:
    # Windows is required: winPEAS targets .NET Framework 4.8 and builds with MSBuild.
    name: winPEAS build and .NET unit tests
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      Solution_Path: 'winPEAS\winPEASexe\winPEAS.sln'
      Configuration: 'Release'
    steps:
      - uses: actions/checkout@v4

      - name: Download regexes
        run: powershell.exe -ExecutionPolicy Bypass -File build_lists/download_regexes.ps1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore packages
        run: nuget restore $env:Solution_Path

      - name: Build (Any CPU)
        run: msbuild $env:Solution_Path /p:Configuration=$env:Configuration /p:Platform="Any CPU" /p:UseSharedCompilation=false

      - name: Unit tests
        run: dotnet test $env:Solution_Path --configuration $env:Configuration
